<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WebSockets Live Test Rig</title>
        <style>
            body {
                font-family: sans-serif;
                padding: 20px;
                background: #121212;
                color: #fff;
            }
            #log {
                background: #1e1e1e;
                padding: 10px;
                height: 300px;
                overflow-y: scroll;
                border: 1px solid #333;
            }
            .status-on{
                color: #0f0;
            }
            .status-off{
                color: #f00;
            }
        </style>
    </head>
    <body>
        <h1>WebSockets Broadcast console</h1>
        <p id="status" class="status-off">Connecting....</p>
        <form id="message-form">
        <input type="text" id="message-input" placeholder="Type a message..." required />
        <button type="submit">Deploy message</button>
        </form>
        <h3>Live stream Logs: </h3>
        <pre id="log"></pre>
    </body>

    <script>
        const statusEl = document.getElementById('status');
        const log = document.getElementById('log');
        const input = document.getElementById('message-input');

        // initalize websocket handshake
        const socket = new WebSocket('ws://localhost:8080');

        const appendLog = (label, message) => {
            const entry = new Date().toLocaleTimeString() + " - " + label + " " + message + "\n";
            log.textContent = entry + log.textContent;
        }

        // websocket open event listener
        socket.addEventListener("open", () => {
            statusEl.textContent = "Connected: ws://localhost:8080";
            statusEl.classList.add("status-on");
            appendLog('[SYSTEM]', 'Tunnel Established.');
        });


        // websocket close event listener
        socket.addEventListener("close", () => {
            statusEl.textContent = "Disconnected";
            statusEl.classList.remove("status-off");
            appendLog('[SYSTEM]', 'Tunnel collapsed.');
        });

        // websocket message event listener
        socket.addEventListener("message", (event) => {
            appendLog('[RECEIEVED]', event.data);
        });
    
        document.getElementById("message-form").addEventListener("submit", (e) => {
            e.preventDefault();
            
            // websocket connection check
            if(socket.readyState !== WebSocket.OPEN){
                appendLog('[ERROR]', 'No active tunnel found.');
            }

            const message = input.value.trim();
            socket.send(message);
            appendLog('[SENT]', message);
            input.value = '';
        });
    </script>
</html>
